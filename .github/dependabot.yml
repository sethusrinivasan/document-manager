# Dependabot: weekly bumps for Gradle (including version catalog) and Actions.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "sethusrinivasan"
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "deps:"
      include: "scope"
    # Stay on AGP 8.13 + Gradle 8.13 + JUnit 5 while Play 1.1 is shipping.
    # AGP 9 / Gradle 9 / JUnit 6 need a dedicated upgrade, not a weekly PR pile.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
      # Compose BOM 2026.08+ and Hilt Navigation 1.4 need AGP 9 + compileSdk 37.
      - dependency-name: "androidx.compose:compose-bom"
        versions: [">=2026.08.00"]
      - dependency-name: "androidx.hilt:hilt-navigation-compose"
        versions: [">=1.4.0"]
    groups:
      androidx:
        patterns:
          - "androidx*"
          - "com.google.android.gms*"
          - "com.google.mlkit*"
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp*"
      testing:
        patterns:
          - "org.junit*"
          - "io.kotest*"
          - "io.mockk*"
          - "androidx.test*"
      di-and-crypto:
        patterns:
          - "com.google.dagger*"
          - "org.bouncycastle*"
          - "net.lingala.zip4j*"
          - "androidx.security*"
          - "com.google.code.gson*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "sethusrinivasan"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci:"
      include: "scope"
