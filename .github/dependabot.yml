# Dependabot: weekly bumps for Gradle (including version catalog) and Actions.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "sethusrinivasan"
    labels:
      - "dependencies"
      - "gradle"
    commit-message:
      prefix: "deps:"
      include: "scope"
    groups:
      androidx:
        patterns:
          - "androidx*"
          - "com.google.android.gms*"
          - "com.google.mlkit*"
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp*"
      testing:
        patterns:
          - "org.junit*"
          - "io.kotest*"
          - "io.mockk*"
          - "androidx.test*"
      di-and-crypto:
        patterns:
          - "com.google.dagger*"
          - "org.bouncycastle*"
          - "net.lingala.zip4j*"
          - "androidx.security*"
          - "com.google.code.gson*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "sethusrinivasan"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci:"
      include: "scope"
