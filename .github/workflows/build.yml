name: Build Android App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches
        key: gradle-${{ hashFiles('**/*.gradle*') }}
    - name: Bump version
      run: |
        sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
        sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.0.${{ github.run_number }}\"/" app/build.gradle.kts
    - name: Build Debug
      run: chmod +x gradlew && ./gradlew assembleDebug
    - name: Build Release
      run: ./gradlew assembleRelease
      continue-on-error: true
    - name: Run Tests
      run: ./gradlew testDebugUnitTest
    - name: Prepare artifacts
      run: |
        mkdir -p artifacts
        cp app/build/outputs/apk/debug/app-debug.apk artifacts/document-manager-debug.apk
        cp app/build/outputs/apk/release/app-release*.apk artifacts/document-manager-release.apk 2>/dev/null || true
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: apks-v1.0.${{ github.run_number }}
        path: artifacts/
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: v1.0.${{ github.run_number }}
        body: "Build #${{ github.run_number }} from commit ${{ github.sha }}"
        files: artifacts/*
