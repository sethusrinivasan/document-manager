# Ceiling: last AGP 8.x is 8.13.2 (compileSdk 36). AndroidX Core 1.19,
# Lifecycle 2.11, Navigation 2.10, Hilt Navigation 1.4, Compose BOM 2026.08+
# require AGP 9 + compileSdk 37.
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"
hilt = "2.58"
composeBom = "2026.06.01"
coroutines = "1.11.0"
room = "2.8.5"
lifecycle = "2.10.0"
activity = "1.13.0"
navigation = "2.9.8"
coreKtx = "1.18.0"
hiltNavigation = "1.3.0"
documentFile = "1.1.0"
zip4j = "2.11.6"
bouncycastle = "1.86"
securityCrypto = "1.1.0"
gson = "2.14.0"
mlkitText = "16.0.1"
mlkitDocScanner = "16.0.0"
biometric = "1.1.0"
junitBom = "6.1.3"
kotest = "6.2.5"
mockk = "1.14.11"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
